name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    name: End-to-end (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # WebKit runs on macOS: it matches Safari's engine, and headless
          # WebKit on Linux stalled animation frames mid-test (clicks never
          # became "stable"), which iOS and macOS Safari don't do.
          - name: iPhone + iPad WebKit
            os: macos-latest
            browsers: webkit
            projects: --project=iphone --project=ipad
          - name: Desktop Chromium
            os: ubuntu-latest
            browsers: chromium
            projects: --project=desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browsers }}
      - run: npm run test:e2e -- ${{ matrix.projects }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browsers }}
          path: playwright-report/
          retention-days: 7
