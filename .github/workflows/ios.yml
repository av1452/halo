name: iOS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (iOS 26 Simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS
      - name: Check the Xcode project matches project.yml
        run: |
          brew install xcodegen
          xcodegen generate
          git diff --exit-code -- Halo.xcodeproj
      - name: Unit tests
        run: >
          xcodebuild test -project Halo.xcodeproj -scheme Halo
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -only-testing:HaloTests
      - name: UI tests
        run: >
          xcodebuild test -project Halo.xcodeproj -scheme Halo
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -only-testing:HaloUITests
          -resultBundlePath UITests.xcresult
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-test-results
          path: UITests.xcresult
          retention-days: 7
