name: Deploy to GitHub Pages

# Requires Settings → Pages → Source: "GitHub Actions" in the repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Work out the base path
        id: base
        # Project sites live at /<repo>/; a <user>.github.io repo or a custom
        # domain serves from /. Set a repository variable HALO_BASE to override.
        run: |
          if [ -n "${{ vars.HALO_BASE }}" ]; then
            echo "path=${{ vars.HALO_BASE }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi
      - run: npm run check
        env:
          HALO_BASE: ${{ steps.base.outputs.path }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
