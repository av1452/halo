<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed variant for maskable icons: the mark stays inside the central 80% safe zone -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7cfa"/>
      <stop offset="0.55" stop-color="#8e63e6"/>
      <stop offset="1" stop-color="#e46c9a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="246" r="170" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="32"/>
  <circle cx="256" cy="256" r="43" fill="#ffffff" fill-opacity="0.9"/>
</svg>
