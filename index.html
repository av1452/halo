<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Halo — Your digital world, beautifully unified." />
    <meta name="theme-color" content="#f2f2f7" />
    <link rel="icon" type="image/svg+xml" href="/icons/halo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/halo-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS: home screen icon, title and standalone behaviour (older iOS ignores the manifest) -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Halo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Halo — Your Digital Home Hub</title>
    <script>
      // Set the colour theme before first paint so dark-mode users never see
      // a light flash. Mirrors resolveAppearance() in src/design-system/theme.ts.
      try {
        var saved = JSON.parse(localStorage.getItem('halo:theme') || 'null')
        var appearance = (saved && saved.data && saved.data.appearance) || 'system'
        var dark = appearance === 'dark' || (appearance === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Halo needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script>
      // ES5 on purpose: runs on old browsers that can't parse the app bundle
      // (built for Safari 14+) and shows a message instead of a blank page.
      ;(function () {
        var supported = false
        try {
          supported = 'noModule' in document.createElement('script') && typeof Promise !== 'undefined' &&
            new Function('var a = {}; a.b ||= 1; return a?.c ?? a.b')() === 1
        } catch (e) {}
        if (supported) return
        var root = document.getElementById('root')
        root.setAttribute('role', 'alert')
        root.style.cssText = 'font-family:-apple-system,Helvetica,Arial,sans-serif;max-width:32em;margin:15vh auto;padding:0 24px;text-align:center;line-height:1.5'
        root.innerHTML = '<h1 style="font-size:1.4em">Halo needs a newer browser</h1>' +
          '<p>Halo works in Safari on iOS and iPadOS 14 or later, and in current versions of Chrome, Edge and Firefox. Please update your device or open Halo in a newer browser.</p>'
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
